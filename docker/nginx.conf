# mc-web page server + relay proxy (MIT License)
user www-data;   # workers write the sound cache (owned by www-data); without this they run as nobody
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
    access_log off;
    sendfile on;
    client_max_body_size 1m;
    types {
        text/html html; application/javascript js mjs; application/json json; text/css css;
        application/java-archive jar; image/png png; text/plain txt log;
    }
    default_type application/octet-stream;
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }

    server {
        listen 8090;
        # /srv/current points at the finished game, or at the "building" page during the first start
        root /srv/current;
        index index.html;

        gzip_static on;   # classes.js etc. are pre-compressed after each build
        gzip on;
        gzip_types application/javascript application/json text/css text/plain;

        location = /index.html { add_header Cache-Control "no-cache"; }
        location = /favicon.ico { access_log off; log_not_found off; return 204; }
        location ~ \.(js|json|jar)$ { add_header Cache-Control "no-cache"; }   # revalidate (ETag) after rebuilds

        # build progress for the "building" page
        location = /build.log { alias /data/build.log; add_header Cache-Control "no-store"; }

        # multiplayer relay (WebSocket), same origin as the page
        location /relay {
            proxy_pass http://127.0.0.1:8091;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }

        # Minecraft's sounds are not bundled: fetched from Mojang on first use and kept in /data/assets
        location /mc/assets/objects/ {
            root /data/assets;
            try_files $uri @mojang;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location @mojang {
            rewrite ^/mc/assets/objects/(.*)$ /$1 break;
            proxy_pass https://resources.download.minecraft.net;
            proxy_ssl_server_name on;
            proxy_set_header Host resources.download.minecraft.net;
            proxy_store /data/assets$request_uri;
            proxy_store_access user:rw group:rw all:r;
            proxy_temp_path /data/assets/tmp;
        }
    }
}
